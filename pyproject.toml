[project]
name = "public-tender-pipeline"
version = "0.1.0"
description = "入札案件情報システム - 技術検証フェーズ"
requires-python = ">=3.11"
license = { text = "MIT" }

# 実行に必要な依存。
# クロールとHTML解析だけなら requests / beautifulsoup4 / lxml で足りる。
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
# 添付ファイル（PDF / Word / Excel）の本文抽出に使う。
# 未インストールでも SKIPPED ステータスを返して動く設計。
documents = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]
# LLM段（3段目）の実測にのみ使う。技術検証フェーズでは未使用。
llm = ["anthropic>=0.40"]
# 開発・CI用。ここが依存集合の単一の正。
# 🔴 CI の yaml にパッケージ名を直接書かないこと。
#    書くと「ローカルでは動くが CI では落ちる」を繰り返す（実際に2回起きた）。
dev = [
    "public-tender-pipeline[documents,llm]",
    "pytest>=8.0",
    "pypdf>=4.0",       # テスト用のPDFを生成する
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: 外部サイトへ実際に接続するテスト（既定では実行しない）",
    "security: 攻撃入力に対する防御を検証するテスト",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import順
    "B",        # bugbear（バグを生みやすい書き方）
    "S",        # bandit（セキュリティ）
    "UP",       # 古い書き方の検出
    "SIM",      # 冗長な分岐
    "PTH",      # os.path より pathlib
    "RUF",
]
ignore = [
    "E501",    # 行長は formatter に任せる
    "RUF001",  # 全角括弧などを曖昧文字として弾かない（日本語コメントで多用する）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# テストでは assert と一時ファイルの使用を許可する
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# 段階導入。まず「型を書いた関数は正しいか」を保証する
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# 型スタブを提供していない依存。
# requests は CI 環境によってスタブの有無が変わり、
# 「ローカルは緑・CIは赤」を生んだため、明示的に固定する。
# anthropic は LLM実測フェーズでのみ使う任意依存（未インストールでも動く設計）。
module = [
    "bs4.*", "pdfplumber.*", "openpyxl.*", "docx.*", "lxml.*",
    "requests.*", "anthropic.*",
]
ignore_missing_imports = true
