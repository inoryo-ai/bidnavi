name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # サポート下限（3.11）と最新で両方通ることを保証する
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 🔴 パッケージ名をここに直接書かない。
      #    書くと pyproject と二重管理になり、
      #    「ローカルでは動くが CI では落ちる」を繰り返す（実際に2回起きた）。
      #    依存集合の単一の正は pyproject.toml の [project.optional-dependencies].dev。
      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint（ruff）
        run: python -m ruff check .

      - name: 型検査（mypy）
        run: python -m mypy

      # 外部サイトへは接続しない（-m 'not network' が pyproject の既定）。
      # CI が自治体サイトへ負荷をかけないようにするための方針。
      - name: テスト
        run: python -m pytest
        env:
          PYTHONPATH: src
